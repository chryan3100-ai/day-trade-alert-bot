import time
import requests
from datetime import datetime
import json

# === CONFIG - Generated by Day Trade Alerts Dashboard ===
WEBHOOK_URL = ${z}
TICKERS = ${De}
CHECK_INTERVAL = ${k}  # seconds

THRESHOLDS = {
    "volume_multiplier": ${s.volumeSpike.multiplier},
    "fast_move_percent": ${s.fastMover.percent},
    "drop_from_open_percent": ${s.dropFromOpen.percent},
    "alert_volume_spike": ${s.volumeSpike.enabled?"True":"False"},
    "alert_fast_mover": ${s.fastMover.enabled?"True":"False"},
    "alert_day_high_low": ${s.dayHighLow.enabled?"True":"False"},
    "alert_drop_from_open": ${s.dropFromOpen.enabled?"True":"False"},
}

# Track day highs/lows to avoid duplicate alerts
day_highs = {}
day_lows = {}

def send_discord_alert(ticker, title, description, color=0x00FF88):
    """Send embed alert to Discord - safely handles webhook URL"""
    if not WEBHOOK_URL or "discord.com" not in WEBHOOK_URL:
        print(f"[SKIP] No webhook set - {ticker}: {title}")
        return

    embed = {
        "title": title,
        "description": description,
        "color": color,
        "fields": [
            {"name": "Ticker", "value": ticker, "inline": True},
            {"name": "Time", "value": datetime.now().strftime("%I:%M:%S %p ET"), "inline": True},
        ],
        "footer": {"text": "Day Trade Alerts • Webull Watcher"}
    }
    try:
        r = requests.post(WEBHOOK_URL, json={"embeds": [embed]}, timeout=10)
        if r.status_code in [200, 204]:
            print(f"[SENT] {ticker} - {title}")
        else:
            print(f"[FAIL] Discord {r.status_code}: {r.text[:200]}")
    except Exception as e:
        print(f"[ERROR] Discord send failed: {e}")

def check_volume_spike(ticker, df):
    if not THRESHOLDS["alert_volume_spike"]:
        return
    if len(df) < 21:
        return
    avg_vol = df['Volume'].iloc[-21:-1].mean()
    last_vol = df['Volume'].iloc[-1]
    if avg_vol > 0 and last_vol > avg_vol * THRESHOLDS["volume_multiplier"]:
        mult = round(last_vol / avg_vol, 1)
        send_discord_alert(
            ticker,
            f"\uD83D\uDD0A Volume Spike {mult}x",
            f"**{ticker}** volume is **{mult}x** normal\\n"
            f"Avg: {int(avg_vol):,} → Now: {int(last_vol):,}",
            color=0x00FF88
        )

def check_fast_mover(ticker, df):
    if not THRESHOLDS["alert_fast_mover"]:
        return
    if len(df) < 6:
        return
    # 5-min change
    five_ago = df['Close'].iloc[-6]
    last = df['Close'].iloc[-1]
    change = (last - five_ago) / five_ago * 100
    if abs(change) >= THRESHOLDS["fast_move_percent"]:
        emoji = "⚡" if change > 0 else "\uD83D\uDCC9"
        color = 0x00FF88 if change > 0 else 0xFF4D4D
        send_discord_alert(
            ticker,
            f"{emoji} Fast Mover {change:+.2f}% in 5m",
            f"**{ticker}** moved **{change:+.2f}%** in last 5 minutes\\n"
            f"Price: ${"{"}{last:.2f}{'}'}",
            color=color
        )

def check_day_high_low(ticker, df):
    if not THRESHOLDS["alert_day_high_low"]:
        return
    last = df['Close'].iloc[-1]
    day_high = df['High'].max()
    day_low = df['Low'].min()

    prev_high = day_highs.get(ticker)
    prev_low = day_lows.get(ticker)

    if prev_high is None or last > prev_high:
        if last >= day_high * 0.998:  # within 0.2% of high
            send_discord_alert(
                ticker,
                f"\uD83D\uDD25 New Day High",
                f"**{ticker}** hitting day high **${"{"}{last:.2f}{'}'}**",
                color=0xFFCC00
            )
    if prev_low is None or last < prev_low:
        if last <= day_low * 1.002:
            send_discord_alert(
                ticker,
                f"\uD83D\uDCC9 New Day Low",
                f"**{ticker}** hitting day low **${"{"}{last:.2f}{'}'}**",
                color=0xFF4D4D
            )

    day_highs[ticker] = max(day_high, last)
    day_lows[ticker] = min(day_low, last)

def check_drop_from_open(ticker, df):
    """NEW: Dip-buy alert when stock falls X% below open"""
    if not THRESHOLDS["alert_drop_from_open"]:
        return
    if len(df) == 0:
        return
    try:
        # Today's open is first candle's open
        open_price = float(df.iloc[0]['Open'])
        last_price = float(df.iloc[-1]['Close'])
        if open_price == 0:
            return
        drop_pct = (last_price - open_price) / open_price * 100
        threshold = THRESHOLDS["drop_from_open_percent"]

        if drop_pct <= -threshold:
            send_discord_alert(
                ticker,
                f"\uD83D\uDCC9 Drop From Open {drop_pct:.2f}%",
                f"**{ticker}** down **{abs(drop_pct):.2f}%** from open\\n"
                f"Open: ${"{"}{open_price:.2f}{'}'} → Now: ${"{"}{last_price:.2f}{'}'}\\n"
                f"Great dip-buy setup!",
                color=0x5865F2
            )
    except Exception as e:
        print(f"[ERR] drop check {ticker}: {e}")

def scan_ticker(ticker):
    try:
        stock = yf.Ticker(ticker)
        df = stock.history(period="1d", interval="1m")
        if df.empty or len(df) < 2:
            return
        check_volume_spike(ticker, df)
        check_fast_mover(ticker, df)
        check_day_high_low(ticker, df)
        check_drop_from_open(ticker, df)
    except Exception as e:
        print(f"[ERR] {ticker}: {e}")

if __name__ == "__main__":
    print(f"\uD83D\uDE80 Day Trade Bot started - watching {TICKERS}")
    print(f"Interval: {CHECK_INTERVAL}s | Alerts: {THRESHOLDS}")
    send_discord_alert("SYSTEM", "✅ Bot Online", f"Watching {', '.join(TICKERS)} • Checks every {CHECK_INTERVAL}s", 0x5865F2)

    while True:
        for t in TICKERS:
            scan_ticker(t)
        time.sleep(CHECK_INTERVAL)
